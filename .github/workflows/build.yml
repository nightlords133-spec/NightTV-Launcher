name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ] || ! ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager >/dev/null 2>&1; then
            export ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - name: Check YouTube key format
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          K=$(printf '%s' "$YT_API_KEY" | tr -d " \t\r\n\"'")
          if [ -z "$K" ]; then
            echo "::warning::YT_API_KEY не задан — ряд «В тренде» будет скрыт"
          elif [[ "$K" =~ ^AIza[0-9A-Za-z_-]{35}$ ]]; then
            echo "Ключ YouTube: формат верный (AIza…, 39 символов)"
          else
            echo "::warning::YT_API_KEY не похож на API key: длина ${#K}, начало '${K:0:4}'. Нужен ключ вида AIza… (39 символов)"
          fi

      - name: Build APK
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk NightTV-Launcher.apk

      - uses: actions/upload-artifact@v5
        with:
          name: NightTV-Launcher
          path: NightTV-Launcher.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NightTV build ${{ github.run_number }}
          files: NightTV-Launcher.apk
